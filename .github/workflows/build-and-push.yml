name: Build and Push Images

on:
  push:
    branches: [ main ]
    paths:
      - backend/**
      - frontend/**
      - .github/workflows/build-and-push.yml
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      # Prefer secret (as requested). If the username was configured as a repo/org variable instead,
      # this fallback prevents empty tags like "/gitops-demo-backend:latest".
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: ${{ env.DOCKERHUB_USERNAME }}/gitops-demo-backend:latest,${{ env.DOCKERHUB_USERNAME }}/gitops-demo-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: ${{ env.DOCKERHUB_USERNAME }}/gitops-demo-frontend:latest,${{ env.DOCKERHUB_USERNAME }}/gitops-demo-frontend:${{ github.sha }}
