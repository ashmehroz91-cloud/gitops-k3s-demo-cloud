name: Build and Push Images

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/gitops-demo-backend:latest ./backend
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/gitops-demo-backend:latest ${{ secrets.DOCKERHUB_USERNAME }}/gitops-demo-backend:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/gitops-demo-backend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/gitops-demo-backend:${{ github.sha }}

      - name: Build and push frontend image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/gitops-demo-frontend:latest ./frontend
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/gitops-demo-frontend:latest ${{ secrets.DOCKERHUB_USERNAME }}/gitops-demo-frontend:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/gitops-demo-frontend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/gitops-demo-frontend:${{ github.sha }}
