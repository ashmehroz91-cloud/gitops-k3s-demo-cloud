name: Build and Push Images

on:
  push:
    branches: [ main ]
    paths:
      - backend/**
      - frontend/**
      - .github/workflows/build-and-push.yml
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      # Prefer using a GitHub Actions secret for the namespace, but fall back to the known DockerHub user
      # to avoid generating invalid tags like "/repo:tag" when the secret is missing.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_USERNAME || 'ashmehroz1' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Verify DockerHub credentials are present
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "DOCKERHUB_USERNAME is empty. Set the DOCKERHUB_USERNAME secret (or update the fallback)."
            exit 1
          fi
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "DOCKERHUB_TOKEN secret is missing/empty."
            exit 1
          fi

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: ${{ env.DOCKERHUB_USERNAME }}/gitops-demo-backend:latest,${{ env.DOCKERHUB_USERNAME }}/gitops-demo-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: ${{ env.DOCKERHUB_USERNAME }}/gitops-demo-frontend:latest,${{ env.DOCKERHUB_USERNAME }}/gitops-demo-frontend:${{ github.sha }}
