name: Build and Push Images

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build backend image
        working-directory: ./backend
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/gitops-demo-backend:latest .
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/gitops-demo-backend:latest ${{ secrets.DOCKERHUB_USERNAME }}/gitops-demo-backend:${{ github.sha }}
      - name: Push backend image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/gitops-demo-backend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/gitops-demo-backend:${{ github.sha }}

      - name: Build frontend image
        working-directory: ./frontend
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/gitops-demo-frontend:latest .
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/gitops-demo-frontend:latest ${{ secrets.DOCKERHUB_USERNAME }}/gitops-demo-frontend:${{ github.sha }}
      - name: Push frontend image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/gitops-demo-frontend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/gitops-demo-frontend:${{ github.sha }}
