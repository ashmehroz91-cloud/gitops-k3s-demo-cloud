name: Build and Push Images

on:
  push:
    branches: [ main ]
    paths:
      - backend/**
      - frontend/**
      - .github/workflows/build-and-push.yml
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      # Step 1: Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up QEMU for multi-platform builds
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      # Step 3: Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Step 4: Login to DockerHub
      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 5: Build and push backend image
      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/gitops-demo-backend:latest
            ${{ env.DOCKERHUB_USERNAME }}/gitops-demo-backend:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.DOCKERHUB_USERNAME }}/gitops-demo-backend:latest
          cache-to: type=registry,ref=${{ env.DOCKERHUB_USERNAME }}/gitops-demo-backend:cache,mode=max

      # Step 6: Build and push frontend image
      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/gitops-demo-frontend:latest
            ${{ env.DOCKERHUB_USERNAME }}/gitops-demo-frontend:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.DOCKERHUB_USERNAME }}/gitops-demo-frontend:latest
          cache-to: type=registry,ref=${{ env.DOCKERHUB_USERNAME }}/gitops-demo-frontend:cache,mode=max

  