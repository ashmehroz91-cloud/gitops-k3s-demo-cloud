name: Build and Push Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Docker Buildx (fixes docker buildx issues)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login to DockerHub
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ashmehroz1
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # =========================
      # BACKEND BUILD + PUSH
      # =========================
      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ashmehroz1/gitops-demo-backend:latest
            ashmehroz1/gitops-demo-backend:${{ github.sha }}

      # =========================
      # FRONTEND BUILD + PUSH
      # =========================
      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ashmehroz1/gitops-demo-frontend:latest
            ashmehroz1/gitops-demo-frontend:${{ github.sha }}
