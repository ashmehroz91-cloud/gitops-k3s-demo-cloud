name: Build and Push Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Docker Buildx (fixes docker buildx issues)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login to DockerHub
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # =========================
      # BACKEND BUILD + PUSH
      # =========================
      - name: Build backend image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/gitops-demo-backend:latest ./backend
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/gitops-demo-backend:latest \
            ${{ secrets.DOCKERHUB_USERNAME }}/gitops-demo-backend:${{ github.sha }}

      - name: Push backend image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/gitops-demo-backend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/gitops-demo-backend:${{ github.sha }}

      # =========================
      # FRONTEND BUILD + PUSH
      # =========================
      - name: Build frontend image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/gitops-demo-frontend:latest ./frontend
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/gitops-demo-frontend:latest \
            ${{ secrets.DOCKERHUB_USERNAME }}/gitops-demo-frontend:${{ github.sha }}

      - name: Push frontend image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/gitops-demo-frontend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/gitops-demo-frontend:${{ github.sha }}