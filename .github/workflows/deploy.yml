name: Deploy to EKS

on:
  workflow_run:
    workflows:
      - Build and Push Images
    branches:
      - main
    types:
      - completed
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker tag to deploy (default: latest)"
        required: true
        default: "latest"

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    env:
      IMAGE_TAG: >-
        ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: v1.29.0

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region ${{ secrets.AWS_REGION }} --name ${{ secrets.EKS_CLUSTER_NAME }}

      - name: Apply manifests
        run: kubectl apply -f k8s/

      - name: Update images
        run: |
          kubectl set image deployment/backend backend=ashmehroz1/gitops-demo-backend:${IMAGE_TAG}
          kubectl set image deployment/frontend frontend=ashmehroz1/gitops-demo-frontend:${IMAGE_TAG}

      - name: Rollout diagnostics (non-blocking)
        run: |
          echo "Backend rollout status (non-blocking)"
          kubectl rollout status deployment/backend --timeout=180s || true
          echo "Frontend rollout status (non-blocking)"
          kubectl rollout status deployment/frontend --timeout=180s || true
          echo "Current pod status"
          kubectl get pods -o wide || true
